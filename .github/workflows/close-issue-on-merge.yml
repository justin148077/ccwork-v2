name: Close issue on non-default branch merge

# GitHub의 "Closes #N" 자동 이슈 닫기는 default 브랜치(main) 머지에서만 동작한다.
# 이 저장소는 feature/tag-spec 같은 중간 통합 브랜치로 먼저 머지하는 워크플로우를 쓰므로,
# 그 경우를 대신 처리한다. main으로의 머지는 GitHub 기본 동작에 맡기고 건드리지 않는다.

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: PR 본문의 closing keyword로 이슈 닫기
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const keywordPattern = /\b(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s*:?\s*#(\d+)/gi;
            const issueNumbers = new Set();
            let match;
            while ((match = keywordPattern.exec(body)) !== null) {
              issueNumbers.add(Number(match[2]));
            }

            if (issueNumbers.size === 0) {
              console.log('PR 본문에 closing keyword(Closes/Fixes/Resolves #N)가 없습니다.');
              return;
            }

            const prNumber = context.payload.pull_request.number;
            const baseRef = context.payload.pull_request.base.ref;

            for (const issueNumber of issueNumbers) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed',
                  state_reason: 'completed',
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `#${prNumber} 이(가) \`${baseRef}\`(으)로 머지되어 자동으로 닫혔습니다.`,
                });
                console.log(`Closed issue #${issueNumber}`);
              } catch (err) {
                console.log(`Failed to close issue #${issueNumber}: ${err.message}`);
              }
            }
